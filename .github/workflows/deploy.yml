name: Build Active Mirror product source
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Install guard tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Canonical source guard
        run: npm run guard:canonical
      - name: Build
        run: npm run build:deploy
