context_pack:
  id: active_mirror_front_door_context_v1
  updated: 2026-07-04
  objective: Keep Active Mirror product work focused on a simple reflective AI front door with governed outputs.

  include:
    - AGENTS.md
    - README.md
    - .mirror/STATUS.md
    - .mirror/PLAN.md
    - .mirror/DECISIONS.md
    - .mirror/RISKS.md
    - .mirror/SOURCE_LEDGER.md
    - .mirror/TASK_CONTRACT.yaml
    - .mirror/AGENT_POLICY.yaml
    - .mirror/APPROVAL_REQUESTS/TEMPLATE.yaml
    - .mirror/AUDIT_LOGS/TEMPLATE.yaml
