      - direct
      - not clinical
      - not architectural
    enterprise:
      - governed
      - auditable
      - source-backed
      - approval-aware

  current_live_truth:
    app_url: https://activemirror.ai/app/
    app_bundle: index-DaAwZ3Fx.js
    gateway_version: 2026-07-02-first-turn-source-voice-v1
